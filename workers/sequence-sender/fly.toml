app = 'aca-sequence-sender'
primary_region = 'iad'
# Lanes finish their current send and release org leases on SIGTERM (see
# shutdown() in src/index.ts); give them time before Fly force-kills.
kill_timeout = '30s'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Background worker: nothing routes HTTP traffic to it, so Fly's proxy would
  # stop every machine above min_machines_running. Sender machines must stay up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
