# fly.toml for aca-list-building-verifier
#
# Polling-based queue worker: claims items from lb_work_items and processes
# SMTP verification, pattern generation, and ICP scoring.

app = 'aca-list-building-verifier'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LIST_BUILDING_SCRAPER_URL = 'https://aca-list-building-scraper.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1
    soft_limit = 1

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
